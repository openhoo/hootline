version: 1
statePath: var/pipeline-fixer-fixture-state.json

defaults:
  mode: pr_mr
  allowedBranches:
    - main
  allowedFileGlobs:
    - src/**
    - test/**
    - package.json
  verificationCommands:
    - npm test
  sandboxNetworkAllow: []
  fixBranchPrefix: hootline/fix
  maxAttemptsPerSha: 2
  maxSnapshotBytes: 10485760
  allowGitlabSecretTokenFallback: false
  autoMerge:
    requireSuccessfulPipeline: true
    deleteSourceBranch: true

repositories:
  - provider: github
    slug: owner/hootline-pipeline-fixture
    mode: pr_mr
